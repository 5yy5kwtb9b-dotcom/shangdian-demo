<script>(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const routes = {home:['首页','house'],manage:['业务与管理','layout-grid'],profile:['个人中心','user-round']};
  const params = new URLSearchParams(location.search);
  const initialRoute = document.documentElement.dataset.screen || params.get('screen');
  const fixedScreen = Boolean(initialRoute);
  const overview = params.get('view') === 'overview';
  const overviewChild = params.get('view') === 'overview-child' && Object.hasOwn(routes, initialRoute);
  const overviewFrames = new Map();
  const reportedFrames = new Set();
  const frameOrigin = location.protocol === 'file:' ? 'null' : location.origin;
  document.documentElement.classList.toggle('overview-child', overviewChild);
  document.documentElement.classList.toggle('embedded-prototype', fixedScreen && window.parent !== window);
  const media = matchMedia('(min-width: 1080px)');
  let route = Object.prototype.hasOwnProperty.call(routes,initialRoute) ? initialRoute : 'home';
  const positions = {home:0,manage:0,profile:0};
  let period = 'day';
  const selected = {day:'2026-11-12',month:'2026-11'};
  const sampleDate = '2026-11-12';
  let restoreFocus = null;
  let toastTimer = 0;

  function toast(message) {
    const el = byId('toast');
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'),1900);
  }
  // Retain each level's DOM so returning preserves search, selected files, and scroll position.
  const pageSession='sd-'+Math.random().toString(36).slice(2);
  const stack=[];
  let depth=0;
  let historyAvailable=true;
  let pendingReturn=false;
  function rememberLevel() {
    if(!depth)return;
    const item=stack[depth-1];
    item.scroll=document.querySelector('.sheet').scrollTop;
    item.focus=byId('sheet-body').contains(document.activeElement)?document.activeElement:null;
    const fragment=document.createDocumentFragment();
    fragment.append(...byId('sheet-body').childNodes);
    item.fragment=fragment;
  }
  function paintLevel(level) {
    const overlay=byId('overlay');
    const item=stack[level-1];
    depth=level;
    overlay.hidden=!item;
    if(overviewChild)byId('app').classList.toggle('overview-dialog',Boolean(item));
    for(const el of [document.querySelector('.appbar'),byId('scroller'),byId('tabs')])el.inert=Boolean(item);
    if(!item){
      overlay.classList.remove('flow-sheet');byId('sheet-body').replaceChildren();
      const focus=restoreFocus?.isConnected?restoreFocus:byId('scroller');
      focus.focus({preventScroll:true});
      restoreFocus=null;return;
    }
    overlay.classList.toggle('flow-sheet',item.flow);
    const back=overlay.querySelector('.sheet-back');
    back.hidden=!item.flow && level===1;
    back.innerHTML=icon('chevron-right',18);
    byId('sheet-title').textContent=item.title;
    if(item.fragment)byId('sheet-body').replaceChildren(item.fragment);
    else byId('sheet-body').innerHTML=item.html;
    (item.focus?.isConnected?item.focus:byId('sheet-title')).focus({preventScroll:true});
    overlay.querySelector('.sheet').scrollTop=item.scroll || 0;
    document.dispatchEvent(new Event('sd:sheet-visible'));
  }
  function showSheet(title,html,options={}) {
    if(options.key && !options.replace){
      for(let i=depth-1;i>=0;i--){
        if(stack[i].key!==options.key)continue;
        if(i+1<depth)returnTo(i+1);
        return;
      }
    }
    if(!depth)restoreFocus=document.activeElement;
    rememberLevel();
    const position=options.replace && depth>0?depth:depth+1;
    stack.splice(position-1,stack.length,{title,html,flow:!!options.flow,key:options.key});
    if(historyAvailable){
      try{
        const stamp={sdSession:pageSession,sdDepth:position};
        if(options.replace && depth)history.replaceState(stamp,'');
        else history.pushState(stamp,'');
      }catch{historyAvailable=false;}
    }
    paintLevel(position);
  }
  function returnTo(target) {
    if(!depth || pendingReturn)return;
    target=Math.max(0,Math.min(depth-1,target));
    if(historyAvailable && history.state?.sdSession===pageSession){
      pendingReturn=true;
      const leaving=depth;
      history.go(target-depth);
      // Some embedded local-file viewers expose History but silently ignore traversal.
      setTimeout(()=>{
        if(pendingReturn && depth===leaving){pendingReturn=false;historyAvailable=false;rememberLevel();paintLevel(target);}
      },800);
    }else{rememberLevel();paintLevel(target);}
  }
  const closeSheet=()=>returnTo(0);
  window.addEventListener('popstate',event=>{
    pendingReturn=false;
    const target=event.state?.sdSession===pageSession?event.state.sdDepth:0;
    if(target===depth || target>stack.length)return;
    if(!depth)restoreFocus=document.activeElement;
    rememberLevel();paintLevel(target);
  });
  Object.assign(window,{toast,showSheet,closeSheet});
  function activeData() { return period==='day' && selected.day===sampleDate; }
  function dateText() { return selected[period].replace(/-/g,'/'); }
  const dataView = () => ({valid: activeData(), period, date: dateText()});
  function home() { return window.homeScreen(dataView()); }
  function render() {
    const renderers={home,manage:window.renderManage,profile:window.renderProfile};
    byId('view').innerHTML=renderers[route]();
    byId('tabs').innerHTML=Object.entries(routes).map(([key,[label,graphic]])=>`<button class="tab" type="button" data-route="${key}" ${route===key?'aria-current="page"':''}><span class="tab-icon">${icon(graphic,20)}</span>${label}</button>`).join('');
    byId('scroller').scrollTop=positions[route];
  }
  function openDate() {
    const day=period==='day';
    const type=day?'date':'month';
    showSheet(day?'选择统计日期':'选择统计月份',`<form class="date-form" id="date-form"><label for="stat-input">${day?'统计日期':'统计月份'}</label><input id="stat-input" name="date" type="${type}" value="${selected[period]}" required><small>可预览 2026 年 11 月 12 日的设备日报。</small><button type="submit" class="apply">查看统计</button></form>`);
  }
  document.addEventListener('submit',e=>{
    if(e.target.id!=='date-form')return;
    e.preventDefault();
    const val=byId('stat-input').value;
    if(!(period==='day'?/^\d{4}-\d{2}-\d{2}$/:/^\d{4}-\d{2}$/).test(val))return;
    selected[period]=val;
    closeSheet();render();
  });
  function screenURL(mode,screen) {
    const url=new URL(location.href);
    url.hash='';
    url.searchParams.delete('screen');
    url.searchParams.delete('view');
    if(mode)url.searchParams.set('view',mode);
    if(screen)url.searchParams.set('screen',screen);
    return url.href;
  }
  function sizeOverview() {
    const stage=byId('frame-stage'), frames=byId('frames');
    if(!stage.clientWidth || !frames.offsetWidth)return;
    const scale=Math.min(1,stage.clientWidth/frames.offsetWidth);
    frames.style.transform='scale('+scale+')';
    stage.style.height=Math.ceil(frames.offsetHeight*scale)+'px';
  }
  function configure() {
    const board=overview || (media.matches && !fixedScreen);
    byId('board').hidden=!board;
    byId('app').hidden=board;
    byId('board').classList.toggle('is-overview',overview);
    document.querySelector('.overview-toolbar').hidden=!overview;
    if(board) {
      if(!byId('frames').children.length) {
        if(overview)byId('frames').dataset.overviewReady='false';
        for(const [key,[name]] of Object.entries(routes)) {
          const frame=document.createElement('div');
          frame.className='frame';
          const iframe=document.createElement('iframe');
          iframe.title=(key==='manage'?'管理':name)+'交互预览';
          iframe.src=screenURL(overview?'overview-child':'',key);
          frame.append(iframe);
          if(overview){
            const column=document.createElement('section'), heading=document.createElement('h2');
            column.className='overview-col';
            heading.textContent=key==='manage'?'业务中心':name;
            iframe.dataset.overviewScreen=key;
            iframe.setAttribute('scrolling','no');
            overviewFrames.set(key,iframe);
            column.append(heading,frame);
            byId('frames').append(column);
          }else byId('frames').append(frame);
        }
      }
      if(overview)sizeOverview();
    } else if(!byId('tabs').children.length) {
      document.querySelector('.sheet-close').innerHTML=icon('x',18);
      render();
    }
  }
  document.addEventListener('click',e=>{
    if(e.target.closest('.sheet-back')){returnTo(depth-1);return;}
    if(e.target===byId('overlay') || e.target.closest('.sheet-close')){closeSheet();return;}
    const button=e.target.closest('button');
    if(!button)return;
    const data=button.dataset;
    if(data.route) {
      positions[route]=byId('scroller').scrollTop;
      if(route===data.route)positions[route]=0;
      route=data.route;render();return;
    }
    if(data.period){period=data.period;render();return;}
    if(data.detail){window.openDetail(data.detail);return;}
    if(data.home==='date'){openDate();return;}
    if(data.home==='rate'){
      if(activeData()){window.openDetail('机柜在线率');}
      else{showSheet('机柜在线率',`<p class="detail-note">${dateText()} 暂无设备统计。</p><button type="button" class="detail-action" data-home="date">选择其他日期</button>`);}
    }
  });
  document.addEventListener('keydown',e=>{
    if(byId('overlay').hidden)return;
    if(e.key==='Escape'){e.preventDefault();returnTo(depth-1);return;}
    if(e.key!=='Tab')return;
    const elements=[...byId('overlay').querySelectorAll('button:not(:disabled),input,select,textarea,summary,a[href]')].filter(el=>el.getClientRects().length);
    if(!elements.length)return;
    const [first]=elements,last=elements[elements.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  });
  for(const link of document.querySelectorAll('.overview-entry'))link.href=screenURL('overview');
  byId('overview-return').href=screenURL('');
  const imageFile='赏电展业台-三页全览.png';
  const download=byId('overview-download');
  download.href=new URL(location.protocol==='file:'?imageFile:'three-pages.png',location.href).href;
  download.download=imageFile;
  if(overview){
    window.addEventListener('message',event=>{
      const data=event.data;
      if(event.origin!==frameOrigin || data?.type!=='sd.overview.height.v1')return;
      const frame=overviewFrames.get(data.screen);
      if(!frame || event.source!==frame.contentWindow || !Number.isFinite(data.height) || data.height<=0 || data.height>100000)return;
      frame.style.height=Math.ceil(data.height)+'px';
      reportedFrames.add(data.screen);
      sizeOverview();
      if(reportedFrames.size===Object.keys(routes).length)byId('frames').dataset.overviewReady='true';
    });
    window.addEventListener('resize',sizeOverview);
    if(window.ResizeObserver)new ResizeObserver(sizeOverview).observe(byId('frames'));
  }
  configure();
  if(overviewChild && window.parent!==window){
    let lastHeight=0;
    function reportHeight(){
      const height=Math.ceil(byId('app').getBoundingClientRect().height);
      if(height===lastHeight || !height)return;
      lastHeight=height;
      window.parent.postMessage({type:'sd.overview.height.v1',screen:initialRoute,height},frameOrigin==='null'?'*':frameOrigin);
    }
    if(window.ResizeObserver)new ResizeObserver(reportHeight).observe(byId('app'));
    else new MutationObserver(reportHeight).observe(byId('app'),{subtree:true,childList:true,attributes:true});
    window.addEventListener('resize',reportHeight);
    window.addEventListener('load',reportHeight);
    document.fonts?.ready.then(reportHeight);
    requestAnimationFrame(reportHeight);
  }
  if (media.addEventListener) media.addEventListener('change',configure);
  else media.addListener(configure);
})();
</script>
</body></html>
