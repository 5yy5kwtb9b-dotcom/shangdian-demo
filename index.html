<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f6f8f0"><title>赏电展业台 · 设备看板</title><style>:root{color-scheme:light;--paper:#f6f7fb;--ink:#1b2135;--muted:#626a7a;--accent:#4b42bb;--line:#e1e3ea;--face:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;--num:"Inter","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body,button,input,select,textarea{font-family:var(--face);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
body{background:#edf0f4}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;border:0;background:none;color:inherit}
a{color:var(--accent)}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:active{filter:brightness(.95)}
[hidden]{display:none!important}
h1,h2,p{margin:0}
svg{display:inline-block;flex:none;vertical-align:middle}
#app{position:relative;width:100%;max-width:520px;margin:0 auto;height:100%;height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:var(--paper);isolation:isolate}
.appbar{padding:max(11px,env(safe-area-inset-top)) 20px 8px;min-height:46px;display:flex;flex:none;align-items:center;justify-content:space-between}
.brand,.board-brand{display:flex;align-items:center;gap:7px}
.brand-symbol{position:relative;background:var(--accent);width:24px;height:24px;border-radius:7px;display:inline-grid;place-items:center;flex:none;isolation:isolate}
.brand-symbol:before{content:"";width:60%;height:68%;background:#edff9b;clip-path:polygon(43% 0,98% 0,66% 40%,92% 40%,15% 100%,36% 55%,6% 55%);transform:skew(-4deg)}
.brand strong{font-size:17px;letter-spacing:-.7px;font-weight:800}
.brand-divider{height:12px;width:1px;background:#cbcbd0;margin:0 2px}
.org-name{font-size:12px;color:var(--muted);font-weight:580}
.demo-indicator{font-size:10px;font-weight:580;display:flex;align-items:center;gap:5px;color:var(--muted);letter-spacing:.25px}
.demo-indicator i,.board-meta i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.scroll-area{overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;flex:1;min-height:0;scrollbar-width:none;outline:none}
.scroll-area::-webkit-scrollbar{display:none}
#view{padding:6px 18px 20px}
.tabbar{z-index:2;display:flex;flex:none;justify-content:space-around;background:white;padding:7px 10px max(7px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.tab{display:flex;align-items:center;justify-content:center;gap:4px;flex:1;min-height:44px;font-size:12px;font-weight:590}
.tab-icon{display:grid;place-items:center}
.overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:end;justify-content:center;background:#13203165;backdrop-filter:blur(2px)}
.sheet{width:100%;background:white;border-radius:21px 21px 0 0;max-height:88%;overflow-y:auto;padding:8px 20px max(22px,env(safe-area-inset-bottom));box-shadow:0 -7px 24px #19132913}
.handle{width:34px;height:4px;background:#dad8e0;border-radius:3px;margin:0 auto 9px}
.sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-header h2{font-size:22px;letter-spacing:-.6px}
.sheet-close{width:38px;height:38px;background:#f1f2f3;border-radius:50%;display:grid;place-items:center}
.toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:11px;opacity:0;pointer-events:none;z-index:20;white-space:nowrap;font-size:13px}
.toast.show{opacity:1}
.date-form{padding:4px 0;display:grid;gap:12px}
.date-form input{width:100%;border:1px solid var(--line);min-height:44px;border-radius:8px;padding:8px 11px;background:#fff}
.date-form .apply{min-height:44px;background:var(--accent);color:white;border-radius:9px;font-weight:650}
.date-form small{color:var(--muted);line-height:1.6}
#board{min-height:100dvh;background:#eaecef;padding:23px clamp(18px,4.4vw,72px) 27px}
.board-head{max-width:1390px;margin:0 auto 20px;display:flex;align-items:center;justify-content:space-between}
.board-brand{gap:10px}.board-brand .brand-symbol{width:30px;height:30px;border-radius:8px}
.board-brand strong{font-size:21px;letter-spacing:-.8px;font-weight:750}
.board-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:#555f6a}.board-meta a{color:inherit;text-underline-offset:3px;margin-right:8px}
.frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2.5vw,41px);max-width:1390px;margin:auto}
.frame{height:calc(100dvh - 107px);min-height:620px;max-height:1000px;border-radius:23px;overflow:hidden;border:1px solid #d4d5d9;box-shadow:0 15px 30px -21px #1c253d66;background:var(--paper)}
.frame iframe{display:block;border:0;width:100%;height:100%}
@media(max-width:355px){#view{padding-left:13px;padding-right:13px}.appbar{padding-left:15px;padding-right:15px}}
@media(prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:translateY(0);opacity:1}}}

.appbar-actions{display:flex;align-items:center;gap:12px}
a.overview-entry{font-size:12px;font-weight:630;color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;min-height:32px}
.embedded-prototype .appbar .overview-entry{display:none}
#board.is-overview{padding:0 0 20px;min-height:100vh}
#board.is-overview .board-head{display:none}
.overview-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1240px;margin:0 auto;padding:max(7px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 7px max(12px,env(safe-area-inset-left))}
.overview-toolbar h1{font-size:17px;letter-spacing:-.03em;line-height:1.3;margin:0}
.overview-toolbar a{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 6px;text-decoration:none;font-size:13px;font-weight:630}
#overview-download{padding:0 12px;border-radius:8px;background:var(--accent);color:white}
#board.is-overview #frame-stage{position:relative;width:min(100%,1240px);margin:0 auto;overflow:hidden}
#board.is-overview #frames{position:absolute;left:0;top:0;width:1240px;max-width:none;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;gap:16px;padding:16px;margin:0;background:#e9eee3;transform-origin:0 0}
.overview-col{min-width:0}
.overview-col h2{font-size:17px;font-weight:700;padding:3px 3px 10px;line-height:1.35}
#board.is-overview .frame{border-radius:14px;min-height:0;max-height:none;height:auto;box-shadow:0 3px 11px #2335210d}
#board.is-overview .frame iframe{height:680px}
html.overview-child,html.overview-child body{height:auto;min-height:0;overflow:hidden}
html.overview-child #app{height:auto;min-height:0;max-width:none;overflow:visible}
html.overview-child #scroller{flex:none;overflow:visible;min-height:0}
html.overview-child #tabs{position:static}
html.overview-child #app.overview-dialog>.appbar,html.overview-child #app.overview-dialog>#scroller,html.overview-child #app.overview-dialog>#tabs{display:none}
html.overview-child #app #overlay:not([hidden]){display:block;position:static;inset:auto;backdrop-filter:none;background:var(--paper)}
html.overview-child #app #overlay:not([hidden]) .sheet{height:auto;min-height:0;max-height:none;overflow:visible;border-radius:0;box-shadow:none}
html.overview-child #app #overlay .sheet-header{position:static}

.detail-body {
  --detail-ink: #262638;
  --detail-muted: #626375;
  --detail-stroke: #e7e6ed;
  --detail-accent: #5940cd;
  display: grid;
  gap: 14px;
  color: var(--detail-ink);
  text-align: left;
}
.detail-body * { box-sizing: border-box; }
.detail-body .detail-note {
  display: inline-flex;
  align-items: center;
  justify-self: start;
  gap: 6px;
  padding: 4px 8px;
  border-radius: 5px;
  background: #f1eff8;
  font-size: 11px;
  line-height: 1.5;
  color: #66578c;
}
.detail-note i { width: 5px; height: 5px; border-radius: 50%; background: #8069c7; }
.detail-stats { display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; gap: 9px; }
.detail-stat {
  min-height: 84px;
  padding: 13px;
  border-radius: 14px;
  background: #f1edfc;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 7px;
}
.detail-stat span, .detail-form label { font-size: 12px; color: var(--detail-muted); }
.detail-stat strong {
  color: #372964;
  font: 650 clamp(20px, 5.7vw, 27px)/1.1 ui-sans-serif, system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.05em;
}
.detail-stat small { margin-left: 4px; font-size: 11px; letter-spacing: 0; }
.detail-block { padding: 0; margin: 0; }
.detail-block h3 { font-size: 14px; font-weight: 700; margin: 3px 0 5px; }
.detail-row {
  min-height: 43px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 0;
  font-size: 13px;
  line-height: 1.55;
  border-bottom: 1px solid var(--detail-stroke);
}
.detail-row:last-child { border-bottom: 0; }
.detail-row > span { color: var(--detail-muted); }
.detail-row > strong { font-size: inherit; text-align: right; font-weight: 600; overflow-wrap: anywhere; }
.detail-body .detail-action {
  width: 100%;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 9px;
  padding: 11px 13px;
  border: 0;
  border-radius: 10px;
  background: #f1eff9;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.5;
  font-family: inherit;
  color: var(--detail-accent);
  cursor: pointer;
}
.detail-action + .detail-action { margin-top: 6px; }
.detail-action span { font-size: 17px; line-height: 1; }
.detail-body summary:focus-visible, .detail-body button:focus-visible, .detail-body input:focus-visible { outline: 2px solid var(--detail-accent); outline-offset: 2px; }
.detail-empty {
  padding: 16px;
  border: 1px solid var(--detail-stroke);
  border-radius: 12px;
  background: #faf9fc;
}
.detail-empty strong { display: block; font-size: 14px; }
.detail-empty p, .detail-form p { margin: 5px 0 0; color: var(--detail-muted); font-size: 12px; line-height: 1.7; }
.detail-accordion { border-bottom: 1px solid var(--detail-stroke); }
.detail-accordion summary {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 48px;
  cursor: pointer;
  font-size: 14px;
  list-style: none;
}
.detail-accordion summary::-webkit-details-marker { display: none; }
.detail-accordion summary small { margin-left: auto; font-size: 11px; color: var(--detail-muted); white-space: nowrap; }
.detail-accordion summary::after { content: ''; width: 6px; height: 6px; margin: 0 3px; border: solid #898598; border-width: 0 1.6px 1.6px 0; transform: rotate(-45deg); }
.detail-accordion[open] summary::after { transform: rotate(45deg); }
.detail-accordion[open] > div { padding: 0 10px; border-radius: 9px; background: #f7f6f9; margin-bottom: 8px; }
.detail-form { display: grid; gap: 12px; }
.detail-form input { width: 100%; margin-top: 6px; border: 1px solid #d7d3e4; border-radius: 9px; padding: 10px; font: inherit; font-size:16px; color: var(--detail-ink); background: #fff; }
.detail-form .detail-action { color: #fff; background: #6046d5; }

:root{--paper:#f4f5fa;--ink:#1f2237;--accent:#493aba;--muted:#62667c;--line:#dedfea;--icon-accent:#7668f1}
#board{background:radial-gradient(ellipse at 92% 0%,#e4def4 0,transparent 62%),#ebedf4}
.a-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 14px}
.a-title h1,.a-sh h2{letter-spacing:-.9px;line-height:1.22;font-weight:750}
.a-title h1{font-size:30px}
.a-quick{display:flex;align-items:center;gap:5px}.a-quick button{border:1px solid #d9d5f1;color:#463498;background:#ede9ff;border-radius:10px;min-height:36px;padding:0 11px;font-size:12px;font-weight:650}
.a-quick button:last-child{background:white;border-color:#dedfe7;color:#36364c}
.a-home section+section{margin-top:15px}
.a-hero{position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 90% 36%,#5553ba 0,transparent 56%),linear-gradient(115deg,#20203f 0%,#343373 72%,#3c3b83 100%);color:white;border-radius:19px;box-shadow:0 6px 18px #27214b18}
.a-hero-head,.a-hero-main{padding:0 17px;position:relative}
.a-hero-head{display:flex;align-items:center;justify-content:space-between;padding-top:12px}
.a-hero-head h2{font-size:14px;font-weight:650;display:flex;align-items:center;gap:6px}
.a-hero-head h2 i{width:7px;height:7px;border-radius:50%;background:#c9f583;box-shadow:0 0 0 3px #c9f58317}
.period-toggle{display:inline-flex;background:#2423459c;padding:2px;border-radius:8px}
.period-toggle button{min-width:34px;min-height:28px;font-size:12px;color:#e2dff7;border-radius:6px}
.period-toggle button[aria-pressed=true]{background:#d8f589;color:#24253b;font-weight:700}
.a-hero-main{display:flex;justify-content:space-between;align-items:center;padding-top:2px;padding-bottom:8px}
.a-rate{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:0}
.rate-value{font:570 clamp(44px,13.4vw,56px)/1.07 var(--num);letter-spacing:-2.9px}
.rate-value small{font-size:.42em;letter-spacing:-1px;margin-left:3px}
.a-rate>span+span{font-size:12px;color:#eeeefa;font-weight:560;margin-top:2px}
.hero-date{display:flex;align-items:center;gap:5px;color:#d5d6ee;min-height:29px;font-size:10.5px;padding:0;--icon-accent:#bdc4ff}
.a-product{flex:none;position:relative;isolation:isolate;display:grid;place-items:center;border:0;background:none;width:91px;height:91px;margin-right:7px}
.a-product img{width:38px;height:48px;object-fit:contain;filter:drop-shadow(1px 4px 3px #191b3c66);z-index:1}
.a-orbit{position:absolute;inset:3px;display:block;border-radius:50%;background:conic-gradient(from 215deg,#ffffff22 0 100%);mask:radial-gradient(circle,transparent 65%,#000 66%);transform:rotate(0)}
.has-value .a-orbit{background:conic-gradient(from 218deg,#acb7fa 0%,#dcf79c 88%,#e0fa9a 89.8%,#d6d8ff25 90.2% 100%)}
.a-product:before,.a-product:after{content:"";position:absolute;border-radius:50%;inset:-5px;border:1px solid #c4c7ff26;z-index:-1}
.a-product:after{inset:12px;border-style:dashed;border-color:#c4c7ff44}
.a-summary{display:grid;grid-template-columns:repeat(3,1fr);background:#1b1b3c88;border-top:1px solid #ffffff24;padding:9px 2px 10px;margin:0}
.hero-stat{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;align-items:center;justify-content:center;column-gap:4px;row-gap:3px;padding:0;color:white}
.hero-stat+.hero-stat{border-left:1px solid #ffffff29}
.hero-stat span{font-size:10.5px;color:#deddf4}
.hero-stat i{height:5px;width:5px;border-radius:50%;background:#bcb8d6}
.hero-stat:nth-child(2) i{background:#d6f495}.hero-stat:nth-child(3) i{background:#ffb581}
.hero-stat b{grid-column:1/-1;grid-row:1;font:580 24px/1 var(--num);letter-spacing:-.7px}
.hero-footnote{font-size:10.5px;color:#656b7a;text-align:right;margin:5px 2px 0}
.a-sh,.a-claim-top,.a-compare{display:flex;justify-content:space-between;align-items:center}
.a-sh{margin:0 1px 8px;min-height:26px}.a-sh h2{font-size:19px}.a-sh>button,.a-sh>span{display:flex;align-items:center;gap:3px;font-size:11.5px;color:var(--muted)}
.a-sh>button{min-height:30px}.a-queue{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #e0e2ec;border-radius:16px;background:white;padding:12px 1px}
.a-task{position:relative;min-width:0;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:610;white-space:nowrap}
.a-task+.a-task:before{content:"";height:29px;border-left:1px solid #e6e7ef;position:absolute;left:0;top:12px}
.a-task-top{height:24px;display:flex;align-items:center;gap:2px;color:#484095}
.a-task-top b{font:640 19px/1 var(--num);letter-spacing:-.6px;color:#24223f}
.a-task-top i{align-self:start;background:#e67946;width:7px;height:7px;border-radius:50%;margin-top:1px}
.a-task.task-3{--icon-accent:#f19662}
.a-metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px}.a-metric{background:white;border:1px solid #dfe1ed;padding:13px 13px 11px;text-align:left;border-radius:15px}
.a-m-label{display:flex;gap:5px;align-items:center;color:#545870;font-size:12px;font-weight:620}
.a-value{display:flex;gap:5px;align-items:baseline;margin:4px 0 8px}.a-value strong{font:600 32px/1.05 var(--num);letter-spacing:-1.4px}.a-value small,.a-compare{font-size:11px;color:#63677b}
.a-compare i{font-style:normal;font-weight:650;padding:2px 5px;border-radius:5px;background:#f0effc;color:#5448a7}
.a-claim{display:block;text-align:left;width:100%;background:white;border:1px solid #e0e2eb;padding:12px 14px 11px;border-radius:15px}
.a-claim-top{gap:5px;font-size:14px}.a-claim-top strong{margin-left:auto;font:620 18px/1.1 var(--num)}.a-claim-top svg{color:#787c90}
.a-progress{display:block;width:100%;height:4px;background:#eeedf8;border-radius:10px;margin:9px 0 5px}.a-progress i{display:block;width:84.2857%;height:100%;background:#aaa1f1;border-radius:10px}
.a-claim small{font-size:10.5px;color:#63677b}
.tabbar{gap:3px}.tab{flex-direction:column;color:#697086;--icon-accent:#858da5;font-size:10.5px;gap:2px}
.tab-icon{width:40px;height:24px;border-radius:8px}.tab[aria-current=page]{color:#4333a4;--icon-accent:#7160dc;font-weight:710}.tab[aria-current=page] .tab-icon{background:#ece8ff}
@media(max-width:355px){.a-quick button{padding:0 8px}.a-title h1{font-size:26px}.a-task{font-size:11.4px}.a-product{width:76px;height:76px;margin-right:4px}.a-product img{width:33px;height:41px}}

.a-trade-periods { display: inline-flex; gap: 1px; padding: 2px; background: #e9e8f5; border-radius: 9px; }
.a-trade-periods button { min-height: 34px; min-width: 39px; padding: 3px 7px; border-radius: 7px; font-size: 13px; color: var(--muted); }
.a-trade-periods button[aria-pressed="true"] { color: #fff; background: var(--accent); font-weight: 700; }
.a-trade-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: #fff; }
.a-trade-cell { display: grid; align-content: start; gap: 4px; padding: 12px 14px; text-align: left; min-width: 0; }
.a-trade-cell:nth-child(odd) { border-right: 1px solid var(--line); }
.a-trade-cell:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
.a-trade-label { position: relative; display: flex; align-items: center; min-height: 23px; padding-right: 24px; color: var(--ink); font-weight: 650; font-size: 14px; }
.a-metric-help { position: absolute; top: 50%; right: -10px; transform: translateY(-50%); display: grid; place-items: center; width: 40px; height: 38px; padding: 0; color: var(--muted); }
.a-metric-help > span { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1.4px solid currentColor; font: 700 11px/1 var(--num); }
.a-trade-number { display: flex; gap: 4px; align-items: baseline; }
.a-metric-definition, .a-announcement p { margin: 0; font-size: 16px; line-height: 1.75; color: var(--ink); }
.a-review-card { display: grid; gap: 9px; width: 100%; padding: 15px; background: white; color: var(--ink); border: 1px solid var(--line); border-radius: 13px; text-align: left; }
.a-review-head, .a-review-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.a-review-head > b { font-size: 16px; }
.a-review-status { background: #edf3e3; color: #34512a; font-size: 12px; font-weight: 650; border-radius: 5px; padding: 3px 6px; }
.a-review-status.is-failed { background: #f9ede2; color: #8b351e; }
.a-review-card > strong { font-size: 14px; line-height: 1.5; }
.a-review-reason, .a-review-foot { color: var(--muted); font-size: 13px; line-height: 1.5; }
.a-review-foot { padding-top: 8px; border-top: 1px solid var(--line); }
.a-review-foot > span { color: var(--accent); font-weight: 600; white-space: nowrap; }
.a-trade-cell small { font-size: 11px; font-weight: 500; color: var(--muted); }
.a-trade-cell strong { font: 620 clamp(23px,6.9vw,31px)/1.1 var(--num); font-variant-numeric: tabular-nums; letter-spacing: -.04em; }
.a-trade-previous { color: var(--muted); font-size: 12px; }
.a-device-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 3px 1px 0; }
.a-device-foot > span { font-size: 12px; color: var(--muted); }
.a-offline-entry { display: inline-flex; align-items: center; gap: 3px; min-height: 40px; padding: 0 8px; font-weight: 650; color: #873b23; }
.a-claim-top > svg { margin-left: auto; }
.a-loss-line { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; gap: 8px; }
.a-loss-line > span { color: var(--muted); font-size: 13px; }
.a-loss-line strong { font: 650 22px/1.1 var(--num); font-variant-numeric: tabular-nums; }
.has-value .a-orbit { background: conic-gradient(from 218deg,#b4b5fc 0%,#dcf79c var(--a-online-rate),#d6d8ff25 var(--a-online-rate) 100%); }

.ma-page {
  --ma-blue: #3f39ae;
  --ma-ink: #1c2340;
  --ma-muted: #626b86;
  --ma-stroke: #dce1ef;
  --ma-mist: #eef2fc;
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  color: var(--ma-ink);
  text-align: left;
}
.ma-page *, .ma-page *::before, .ma-page *::after { box-sizing: border-box; }
.ma-page button, .ma-page input { font: inherit; }
.ma-page button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.ma-page button:focus-visible { outline: 2px solid var(--ma-blue); outline-offset: -2px; }
.ma-title { display: flex; align-items: center; margin: 3px 0 17px; }
.ma-title h1 { margin: 0; font-size: 34px; font-weight: 790; line-height: 1.16; letter-spacing: -1.6px; }
.ma-search {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  height: 46px;
  padding: 0 15px;
  color: #5b6388;
  background: #edf1fb;
  border: 1px solid #dee3f2;
  border-radius: 13px;
}
.ma-search:focus-within { background: #fff; border-color: #7c78cb; box-shadow: 0 0 0 2px #3f39ae16; }
.ma-search input {
  flex: 1;
  min-width: 0;
  height: 100%;
  padding: 0;
  border: 0;
  outline: 0;
  border-radius: 0;
  background: transparent;
  color: var(--ma-ink);
  font-size: 16px;
  appearance: none;
}
.ma-search input:focus-visible { outline: 0; }
.ma-search input::placeholder { color: #626c86; font-size: 14px; }
.ma-clear { display: grid; place-items: center; flex: none; width: 40px; height: 40px; margin-right: -11px; padding: 0; background: transparent; border: 0; border-radius: 10px; color: var(--ma-muted); }
.ma-clear[hidden], .ma-list[hidden] { display: none; }
.ma-index-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 22px 0 11px; }
.ma-index-head h2 { margin: 0; font-size: 18px; line-height: 1.3; letter-spacing: -.6px; font-weight: 730; }
.ma-index-head > span { color: var(--ma-muted); font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
.ma-panels { display: flex; flex-direction: column; gap: 10px; }
.ma-panel { border: 1px solid var(--ma-stroke); border-radius: 15px; background: #fff; overflow: hidden; }
.ma-panel h2 { margin: 0; font-size: inherit; }
.ma-panel .ma-heading {
  width: 100%;
  display: flex;
  gap: 10px;
  align-items: center;
  min-height: 66px;
  padding: 11px 14px;
  color: var(--ma-ink);
  background: #fff;
  border: 0;
  text-align: left;
}
.ma-cover-icon { display: grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: 11px; color: var(--ma-blue); background: #eef0fb; }
.ma-cover-icon svg, .ma-entry-symbol svg { display: block; }
.ma-cover-title { font-size: 17px; font-weight: 720; line-height: 1.25; letter-spacing: -.45px; }
.ma-count { margin-left: auto; margin-right: 3px; font-size: 12px; font-weight: 550; line-height: 1.3; color: var(--ma-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ma-expander { display: grid; place-items: center; flex: none; width: 20px; height: 20px; color: #676e88; border-radius: 100%; background: var(--ma-mist); }
.ma-expander::after { content: ""; width: 6px; height: 6px; margin-top: -2px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); }
.ma-panel:has(.ma-heading[aria-expanded="true"]) { border-color: #c2c5e7; box-shadow: 0 3px 10px #302d7808; }
.ma-heading[aria-expanded="true"] { color: white; background: linear-gradient(108deg, #33318f, #4b43b5); }
.ma-heading[aria-expanded="true"] .ma-cover-icon { color: #353483; background: #efefff; }
.ma-heading[aria-expanded="true"] .ma-count { color: #ececfb; }
.ma-heading[aria-expanded="true"] .ma-expander { color: #2c3157; background: #dff58c; }
.ma-heading[aria-expanded="true"] .ma-expander::after { margin-top: 3px; transform: rotate(225deg); }
.ma-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; padding: 0; background: #e7eaf4; }
.ma-list:not([hidden]) { border-top: 1px solid #dedff1; }
.ma-entry {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  min-height: 57px;
  border: 0;
  background: white;
  color: var(--ma-ink);
  padding: 9px 13px;
  text-align: left;
}
.ma-entry:last-child:nth-child(odd) { grid-column: 1/-1; }
.ma-entry-symbol { display: grid; place-items: center; flex: none; color: var(--ma-blue); width: 22px; height: 24px; }
.ma-entry > span:last-child { font-size: 14px; font-weight: 580; line-height: 1.4; }
.ma-empty { padding: 32px 12px; text-align: center; border: 1px solid var(--ma-stroke); border-radius: 15px; background: #fff; }
.ma-empty h2 { margin: 0 0 12px; font-size: 16px; }
.ma-empty button { min-height: 42px; padding: 6px 14px; border: 0; background: #eeedfc; color: var(--ma-blue); border-radius: 9px; font-size: 13px; font-weight: 650; }
@media (hover:hover) {
  .ma-heading[aria-expanded="false"]:hover, .ma-entry:hover { background: #f5f6fc; }
  .ma-clear:hover { background: #e2e6f5; }
}
@media (max-width:355px) {
  .ma-panel .ma-heading { padding: 10px 12px; }
  .ma-entry { gap: 6px; padding: 9px 8px; }
}

.pa-page {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  color: #23233b;
}
.pa-page button { appearance: none; color: inherit; font: inherit; cursor: pointer; }
.pa-page button:focus-visible { outline: 3px solid #8b81e5; outline-offset: -3px; }
.pa-page #pa-title { margin: 0 0 17px; font-size: clamp(30px, 8vw, 38px); line-height: 1.18; font-weight: 800; letter-spacing: -.055em; }
.pa-account {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  padding: 17px 18px 0;
  border-radius: 19px;
  background: linear-gradient(111deg, #39329d, #4941b5 75%, #544cc0);
  color: #fff;
}
.pa-account::before {
  content: "";
  pointer-events: none;
  position: absolute;
  z-index: -1;
  inset: 0 0 0 52%;
  background-image: linear-gradient(#e4ddff16 1px, transparent 1px),linear-gradient(90deg,#e4ddff16 1px,transparent 1px);
  background-size: 16px 16px;
  -webkit-mask-image: linear-gradient(to right,transparent,#000);
  mask-image: linear-gradient(to right,transparent,#000);
}
.pa-ident-title { display: flex; align-items: center; gap: 11px; }
.pa-avatar {
  flex: none; display: grid; place-items: center; width: 47px; height: 47px; border-radius: 50%;
  color: #39329d; background: #dcf583; box-shadow: 0 0 0 3px #ffffff18;
}
.pa-ident-text h2 { margin: 0; color: #fff; font-size: 23px; line-height: 1.2; font-weight: 730; letter-spacing: -.025em; }
.pa-ident-text p { margin: 5px 0 0; color: #dedcfa; font-size: 13px; line-height: 1.2; }
.pa-page .pa-switch, .pa-page .pa-copy {
  display: inline-flex; align-items: center; gap: 5px; min-height: 44px; padding: 0; border: 0; background: transparent;
  color: #fff; font-size: 12px; white-space: nowrap;
}
.pa-page .pa-switch { margin-left: auto; }
.pa-page .pa-copy { color: #e0dcff; font-family: ui-monospace, Menlo, monospace; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.pa-page .pa-wallet {
  width: calc(100% + 36px); min-height: 80px; margin: 0 -18px; padding: 12px 18px 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border: 0; border-top: 1px solid #ffffff32; background: #20175c20; text-align: left;
}
.pa-money { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.pa-money-label { display: inline-flex; align-items: center; gap: 6px; color: #efecff; font-size: 12px; line-height: 1.4; }
.pa-money-label svg { color: #d9f18a; }
.pa-money strong { color: #fff; font: 700 34px/1.1 ui-sans-serif, Arial, sans-serif; letter-spacing: -.055em; font-variant-numeric: tabular-nums; }
.pa-money small { margin-right: 4px; font-size: 17px; }
.pa-wallet-link { display: inline-flex; align-items: center; gap: 2px; color: #eef0ff; font-size: 13px; white-space: nowrap; }
.pa-panels { display: grid; gap: 13px; margin-top: 20px; }
.pa-tools { padding: 14px 12px 9px; border: 1px solid #e3e3eb; border-radius: 16px; background: #fff; }
.pa-tools h2 { margin: 0 0 8px 2px; color: #2c2b42; font-size: 16px; font-weight: 730; line-height: 1.35; }
.pa-tools-row { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); }
.pa-page .pa-tool {
  display: flex; flex-flow: column; align-items: center; justify-content: center; gap: 6px;
  position: relative; min-height: 66px; min-width: 0; padding: 6px 1px; border: 0; border-radius: 7px;
  background: transparent; color: #302f44; font-size: 14px; font-weight: 550; line-height: 1.4;
}
.pa-tool + .pa-tool::before { content: ""; position: absolute; top: 16px; bottom: 16px; left: 0; width: 1px; background: #ececf2; }
.pa-tool-icon { display: inline-flex; align-items: center; justify-content: center; color: #4038ae; }
.pa-page .pa-tool:active { background: #f2f1fa; }
.pa-page .pa-wallet:active { background: #20175c44; }
.pa-selected-id { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px; border-radius: 12px; background: #eeedf9; color: #4038ae; }
.pa-selected-id strong, .pa-selected-id small { display: block; }
.pa-selected-id strong { font-size: 16px; }
.pa-selected-id small { margin-top: 5px; color: #5e587e; font-size: 13px; }
.pa-selected-id > span { display: grid; place-items: center; width: 27px; height: 27px; border-radius: 50%; color: #fff; background: #4038ae; }
.pa-notice { margin: 13px 0 3px; color: #656376; font-size: 14px; line-height: 1.6; }
.pa-selectable { margin: 12px 0; font: 650 22px/1.4 ui-monospace, Menlo, monospace; user-select: all; -webkit-user-select: all; }
.pa-wallet-summary { display: grid; gap: 6px; padding: 16px; border-radius: 12px; color: #55516b; background: #f0eff9; font-size: 14px; }
.pa-wallet-summary strong { color: #4038ae; font: 700 29px/1.1 Arial,sans-serif; font-variant-numeric: tabular-nums; }
.pa-no-records { margin: 24px 0 8px; color: #706d83; text-align: center; }
.pa-no-records p { margin: 8px 0; font-size: 14px; }
@media (max-width: 355px) {
  .pa-ident-title { gap: 8px; }
  .pa-avatar { width: 40px; height: 40px; }
  .pa-ident-text h2 { font-size: 21px; }
}

/* 置于 A 版基础样式之后。青柠用于信息与选中状态，业务异常另用红橙色。 */
:root {
  --lime-ink: #172e20;
  --lime-forest: #24472e;
  --lime-signal: #cdf266;
  --lime-soft: #e8f3d1;
  --lime-mist: #f0f4e8;
  --lime-alert: #9e3a1a;
  --paper: #f6f8f0;
  --ink: var(--lime-ink);
  --muted: #506052;
  --accent: #315f2c;
  --icon-accent: #426a29;
  --line: #dce3d5;
}

body { background: #e6ecdf; }
#board { background: linear-gradient(145deg, #f0f3e8, #e1e8d9); }
.frame { border-color: #cbd5c4; }
.brand-symbol { background: var(--lime-forest); }
.brand-symbol::before { background: var(--lime-signal); }
.brand-divider, .board-meta span { background: #c7d0c1; }
.board-meta { color: var(--muted); }
.org-name, .demo-indicator { font-size: 12px; }

.a-title h1, .ma-title h1, .pa-page #pa-title {
  font-size: clamp(29px, 7.8vw, 35px);
  letter-spacing: -.045em;
}
.a-quick button {
  min-height: 42px;
  color: var(--lime-ink);
  background: var(--lime-signal);
  border-color: #a7bf66;
  font-size: 13px;
}
.a-quick button:last-child { color: var(--lime-ink); background: #fff; border-color: #b5c3b0; }
.a-hero {
  color: var(--lime-ink);
  background: linear-gradient(115deg, #dbf78a 4%, #cef26a 73%, #c2e95d);
  box-shadow: 0 3px 12px #354d2415;
}
.a-hero-head h2 { font-size: 16px; }
.a-hero-head h2 i { background: var(--lime-forest); box-shadow: 0 0 0 3px #365a2c20; }
.period-toggle { background: #f4fbde; border: 1px solid #94ad5d; }
.period-toggle button { min-width: 36px; min-height: 32px; color: #35502d; font-size: 13px; }
.period-toggle button[aria-pressed="true"] { color: #fff; background: var(--lime-forest); }
.a-rate, .a-rate > span + span { color: var(--lime-ink); }
.a-rate > span + span { font-size: 14px; }
.rate-value { font-weight: 650; }
.hero-date { min-height: 35px; font-size: 12px; color: #324b2a; --icon-accent: #365529; }
.a-product img { filter: drop-shadow(1px 4px 3px #26402742); }
.a-orbit { background: #a1b671; }
.has-value .a-orbit { background: conic-gradient(from 218deg, #24472e 0% 89.9%, #a3b969 90% 100%); }
.a-product::before, .a-product::after { border-color: #617e3d66; }
.a-summary { background: var(--lime-forest); border-top: 1px solid #3d5c34; }
.hero-stat { color: white; }
.hero-stat + .hero-stat { border-left-color: #57725b; }
.hero-stat span { color: #eef4e7; font-size: 12px; }
.hero-stat i { width: 6px; height: 6px; border-radius: 1px; background: #c5d4d1; }
.hero-stat:nth-child(2) i { border-radius: 50%; background: var(--lime-signal); }
.hero-stat:nth-child(3) i { border-radius: 1px; background: #ffa576; transform: rotate(45deg); }
.hero-footnote, .a-value small, .a-compare, .a-claim small { color: var(--muted); font-size: 12px; }

.a-sh h2 { font-size: 21px; }
.a-sh > button, .a-sh > span { font-size: 13px; }
.a-queue, .a-metric, .a-claim, .pa-tools { border-color: var(--line); }
.a-task { font-size: 13px; }
.a-task + .a-task::before { border-left-color: var(--line); }
.a-task-top, .a-task-top b, .a-m-label, .a-claim-top svg { color: var(--lime-forest); }
.a-task.task-3 { --icon-accent: var(--lime-alert); }
.a-task-top i { background: var(--lime-alert); }
.a-m-label { font-size: 14px; }
.a-value strong { font-size: 34px; }
.a-compare i { color: #344f27; background: var(--lime-soft); }
.a-claim-top { font-size: 16px; }
.a-progress { background: #e5ebdb; }
.a-progress i { background: #5d7d35; }

.tab { color: var(--muted); --icon-accent: #526c52; font-size: 12px; }
.tab[aria-current="page"] { color: var(--lime-ink); --icon-accent: #315c24; }
.tab[aria-current="page"] .tab-icon { background: var(--lime-signal); }

.ma-page {
  --ma-blue: var(--lime-forest);
  --ma-ink: var(--lime-ink);
  --ma-muted: var(--muted);
  --ma-stroke: var(--line);
  --ma-mist: var(--lime-mist);
}
.ma-search { color: var(--lime-forest); background: #fff; border-color: #a1b29c; }
.ma-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px #557b3726; }
.ma-search input::placeholder, .ma-expander { color: var(--muted); }
.ma-cover-icon, .ma-expander { background: var(--lime-mist); }
.ma-panel:has(.ma-heading[aria-expanded="true"]) { border-color: #b9c99e; box-shadow: 0 2px 8px #2741200a; }
.ma-heading[aria-expanded="true"] { color: var(--lime-ink); background: var(--lime-signal); }
.ma-heading[aria-expanded="true"] .ma-cover-icon { color: var(--lime-forest); background: #eef9cd; }
.ma-heading[aria-expanded="true"] .ma-count { color: #354e2d; }
.ma-heading[aria-expanded="true"] .ma-expander { color: #fff; background: var(--lime-forest); }
.ma-list { background: var(--line); }
.ma-list:not([hidden]) { border-top-color: #b9c99e; }
.ma-entry > span:last-child, .ma-empty button { font-size: 15px; }
.ma-empty button { color: var(--lime-ink); background: var(--lime-soft); }

.pa-page, .pa-tools h2, .pa-page .pa-tool { color: var(--lime-ink); }
.pa-account { color: #fff; background: var(--lime-forest); }
.pa-account::before {
  background-image: linear-gradient(#d9f6861a 1px,transparent 1px),linear-gradient(90deg,#d9f6861a 1px,transparent 1px);
}
.pa-avatar { color: var(--lime-ink); background: var(--lime-signal); }
.pa-ident-text p, .pa-page .pa-copy { color: #e1efdb; }
.pa-page .pa-switch, .pa-page .pa-copy { font-size: 13px; --icon-accent: #d1ef9e; }
.pa-page .pa-wallet { color: var(--lime-ink); background: var(--lime-signal); border-color: #adc462; }
.pa-money-label, .pa-money-label svg, .pa-money strong, .pa-wallet-link { color: var(--lime-ink); }
.pa-money-label { font-size: 14px; }
.pa-money strong { font-size: 36px; }
.pa-wallet-link { font-weight: 600; }
.pa-tool + .pa-tool::before { background: var(--line); }
.pa-tool-icon { color: var(--lime-forest); }
.pa-page .pa-tool { font-size: 15px; }
.pa-page .pa-tool:active { background: var(--lime-mist); }
.pa-page .pa-wallet:active { background: #bce954; }
.pa-page button:focus-visible { outline-color: var(--accent); }
.pa-account button:focus-visible { outline-color: var(--lime-signal); }
.pa-account .pa-wallet:focus-visible { outline-color: var(--lime-forest); }
.pa-selected-id, .pa-wallet-summary { color: var(--lime-ink); background: var(--lime-soft); }
.pa-selected-id > span { color: #fff; background: var(--lime-forest); }
.pa-wallet-summary strong { color: var(--lime-ink); }
.pa-selected-id small, .pa-notice, .pa-no-records { color: var(--muted); }

.detail-body {
  --detail-ink: var(--lime-ink);
  --detail-muted: var(--muted);
  --detail-stroke: var(--line);
  --detail-accent: var(--accent);
}
.detail-body .detail-note, .detail-stat, .detail-body .detail-action { color: var(--lime-forest); background: var(--lime-soft); }
.detail-note i { background: var(--accent); }
.detail-stat strong { color: var(--lime-ink); }
.detail-empty, .detail-accordion[open] > div, .sheet-close { background: var(--lime-mist); }
.detail-accordion summary::after { border-color: var(--muted); }
.detail-form input { border-color: #9aab94; }
.detail-form .detail-action, .date-form .apply { color: #fff; background: var(--lime-forest); }
.handle { background: #c6d0bf; }
@media (hover: hover) {
  .ma-heading[aria-expanded="false"]:hover, .ma-entry:hover, .ma-clear:hover { background: var(--lime-mist); }
}
@media (max-width: 355px) {
  .a-task { font-size: 12px; }
  .pa-page .pa-tool { font-size: 14px; }
}

.a-offline-entry { color: var(--lime-alert); }

    chapters.forEach(([heading,summary],index) => {

      if (index>0) actions.push(link('上一节',key+'·'+index));

    });
  }
  policyBook('隐私政策','隐私政策',[

    ['信息披露','本节说明个人信息的披露场景及相应条件。'],

  ]);
  policyBook('用户协议','赏电伙伴服务协议',[
    ['特别提示','本节提示使用者阅读服务协议，并了解与服务使用相关的事项。'],
    ['软件服务','本节介绍赏电伙伴软件提供的服务及其使用范围。'],
    ['账号使用','本节说明使用赏电伙伴账号登录、使用服务时的账号管理事项。']
  ]);

  screens['账号管理'] = {title:'账号管理',rows:[
    {title:person,sub:organization,tag:'当前登录',to:'个人信息'},
    {title:'添加账号',to:'账户·密码登录'},
    {title:'退出登录',to:'账户·退出登录'},
    {title:'注销账号',to:'账户·注销账号'}
  ]};
  const loginModes = [link('密码登录','账户·密码登录'),link('验证码登录','账户·验证码登录')];
  const demoPhone = choice('手机号',['*** **** ****（演示）'],'*** **** ****（演示）');
  const password = choice('密码',['••••••（演示）'],'••••••（演示）');
  const login = {label:'添加账号',submitTo:'账户·添加结果'};
  screens['账户·密码登录'] = {title:'添加账号',note:'选用固定示例体验密码登录。',tabs:loginModes,fields:[demoPhone,password],actions:[login]};
  screens['账户·验证码登录'] = {title:'添加账号',note:passwordNote,tabs:loginModes,fields:[demoPhone,emptyCode],
    actions:[link('获取验证码','账户·已获取验证码'),login]};
  screens['账户·已获取验证码'] = {title:'添加账号',note:'演示验证码已填入。',
    tabs:[loginModes[0],link('验证码登录','账户·已获取验证码')],fields:[demoPhone,demoCode],
    actions:[link('重新获取验证码','账户·已获取验证码'),login]};
  screens['账户·添加结果'] = {title:'添加账号',note:'已完成演示账号添加流程。真实登录状态保持原状。',
    actions:[link('返回账号管理','账号管理')]};
  [['退出登录','退出'],['注销账号','注销']].forEach(([label,verb]) => {
    const key='账户·'+label;
    screens[key] = {title:label,note:'仅预览'+label+'流程，当前演示账号仍可正常使用。',
      actions:[link('取消','账号管理'),link('模拟'+verb,key+'·结果')]};
    screens[key+'·结果'] = {title:label,note:label+'演示已完成。',
      actions:[link('返回账号管理','账号管理')]};
  });

  Object.assign(window.sdFlows || (window.sdFlows={}),screens);
})();

<script>(() => {
  'use strict';
  const e = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const specs = () => window.sdFlows || {};
  const iconFor = (name,size=18) => window.icon(name,size);
  const demoDay = '2026-11-12';
  const unlocked = new Set();
  const permitted = key => !key || unlocked.has(key);
  const mediaChecks = new WeakMap();
  const dayString = d => [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
  function isoDate(text) { const [y,m,d]=String(text).split('-').map(Number);return new Date(y,m-1,d); }
  function normalize(options) { return (options || []).map(o => typeof o === 'object' ? (o.value ?? o.label ?? '') : String(o)); }
  function calendar(value,visibleMonth) {
    const selected=isoDate(value || demoDay);
    const first=new Date((visibleMonth || selected).getFullYear(),(visibleMonth || selected).getMonth(),1);
    const week=(first.getDay()+6)%7;
    const days=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
    let grid='<i></i>'.repeat(week);
    for(let i=1;i<=days;i++){
      const stamp=dayString(new Date(first.getFullYear(),first.getMonth(),i));
      grid+=`<button type="button" data-fl-day="${stamp}" aria-label="${stamp}" aria-pressed="${stamp===value}" class="${stamp===demoDay?'fl-has-day':''}">${i}</button>`;
    }
    return `<section class="fl-calendar" aria-label="日期选择" data-fl-month="${dayString(first)}"><header><button type="button" data-fl-shift="-1" aria-label="上个月">${iconFor('chevron-right',13)}</button><strong>${first.getFullYear()} 年 ${first.getMonth()+1} 月</strong><button type="button" data-fl-shift="1" aria-label="下个月">${iconFor('chevron-right',13)}</button></header><div class="fl-week">${[...'一二三四五六日'].map(d=>'<b>'+d+'</b>').join('')}${grid}</div></section>`;
  }

  function visual(spec) {
    switch(spec.kind) {
      case 'calendar': {
        const date=(spec.fields || []).find(f=>f.type==='date')?.value || demoDay;
        return calendar(date);
      }
      case 'map':
        return '<figure class="fl-map"><svg aria-hidden="true" viewBox="0 0 320 132" preserveAspectRatio="xMidYMid slice"><rect width="320" height="132" fill="#edf0e7"/><g fill="#dbe4d2"><path d="M0 7L49 0l15 28-49 14zM214 0l41 7-10 24-53-8zM225 106l46-9 13 35h-59zM63 97l44-11 7 46H80z"/></g><path d="M-8 106C74 62 126 120 214 71s105-13 121-20" fill="none" stroke="#c7dfe3" stroke-width="18"/><g fill="none" stroke="#fff" stroke-width="6"><path d="M-10 37L355 100M31-12l64 163M142-11l-21 159M274-8l-91 155M-9 119l181-72L322 18"/></g><path d="M61 96l70-27 41-15 70 12" fill="none" stroke="#638458" stroke-width="3" stroke-dasharray="6 4"/><g stroke="#fff" stroke-width="3" fill="#315f2c"><circle cx="61" cy="96" r="6"/><circle cx="242" cy="66" r="6"/></g></svg><figcaption>离线示意地图</figcaption></figure>';
      case 'poster':
        return '<figure class="fl-poster"><span>赏电</span><strong>随借随还<br>共享充电</strong><figcaption>门店演示海报</figcaption></figure>';
      case 'code':
        return `<div class="fl-code" role="group" aria-label="${e(spec.codeLabel || '演示身份码')}"><div class="fl-code-mark">${iconFor('mg-身份码',58)}</div><strong>${e(spec.codeLabel || '演示身份码')}</strong><small>仅供预览，无真实业务效力</small></div>`;
      default:return '';
    }
  }

  function serialRow(value) {
    return `<div class="fl-sn-row"><input aria-label="设备编号" autocomplete="off" placeholder="输入演示设备编号" value="${e(value)}"><button type="button" data-fl-sn-remove aria-label="删除本行设备编号">${iconFor('x',15)}</button></div>`;
  }
  function fieldHTML(field,index){
    const id='fl-field-'+index, required=field.required?' required':'';
    const type=field.type || 'text';
    const title=e(field.label)+(field.required?'<i aria-hidden="true"> *</i>':'');
    const value=e(field.value ?? '');
    const opt=normalize(field.options);
    if(type==='serials'){
      const initial=Array.isArray(field.value)?field.value:field.value?[String(field.value)]:[''];
      return `<fieldset class="fl-serials" data-fl-serials="${index}"><legend>${title}</legend><div class="fl-sn-list">${initial.map(v=>serialRow(v)).join('')}</div><div class="fl-sn-tools"><button type="button" data-fl-sn-add>添加编号</button><button type="button" data-fl-sn-scan>模拟扫码</button></div></fieldset>`;
    }
    if(type==='checkboxes' || (type==='checkbox' && opt.length)){
      const values=new Set(Array.isArray(field.value)?field.value:String(field.value || '').split(',').map(v=>v.trim()));
      return `<fieldset class="fl-checks" data-fl-group="${index}"><legend>${title}</legend>${opt.map(v=>`<label><input type="checkbox" name="${id}" value="${e(v)}" ${values.has(v)?'checked':''}>${e(v)}</label>`).join('')}</fieldset>`;
    }
    if(type==='checkbox')return `<label class="fl-one-check"><input id="${id}" type="checkbox" ${field.value?'checked':''}${required}>${title}</label>`;
    let control;
    if(type==='select'){
      control=`<select id="${id}"${required}>${!field.value?'<option value="">请选择</option>':''}${opt.map(v=>`<option value="${e(v)}" ${String(field.value)===v?'selected':''}>${e(v)}</option>`).join('')}</select>`;
    } else if(type==='textarea'){
      control=`<textarea id="${id}" rows="3" maxlength="500"${required}>${value}</textarea>`;
    } else if(['file','image','video'].includes(type)){
      const accept=field.accept || (type==='video'?'video/*':type==='image'||/水印照片|照片|图片/.test(field.label)?'image/*':'');
      control=`<input id="${id}" type="file" ${accept?'accept="'+e(accept)+'"':''} data-fl-media="${index}"${required}>`;
    } else {
      const htmlType=['text','tel','password','number','date','time','datetime-local','month','email','url'].includes(type)?type:'text';
      const calendarDate=htmlType==='date'?' data-fl-date':'';
      const min=htmlType==='number'?' min="0" step="any"':'';
      // Password and ID previews accept only an illustrative value.
      control=`<input id="${id}" type="${htmlType}"${calendarDate}${min}${required} autocomplete="off" value="${value}" ${htmlType==='password'?'placeholder="仅填写虚构演示值"':''}>`;
    }
    return `<label class="fl-field" for="${id}"><span>${title}</span>${control}</label>`;
  }

  function filtersHTML(filters) {
    if(!filters?.length) return '';
    const groups=filters.every(item=>typeof item==='string')?[['筛选',...filters]]:filters;
    return `<div class="fl-filters">${groups.map((group,i)=>{
      const [label,...options]=Array.isArray(group)?group:[group];
      const placeholder='<option value="">'+e(label)+'</option>';
      return `<label><span class="fl-sr">${e(label)}</span><select aria-label="${e(label)}" data-fl-filter="${i}">${placeholder}${options.map(o=>`<option value="${e(o==='全部'?'':o)}">${e(o)}</option>`).join('')}</select></label>`;
    }).join('')}</div>`;
  }

  function rowHTML(row){
    const tag=row.tag?`<small class="fl-tag">${e(row.tag)}</small>`:'';
    const content=`<span class="fl-row-text"><b>${e(row.title)}</b>${row.sub!==undefined && row.sub!==''?'<small>'+e(row.sub)+'</small>':''}</span>${tag}${row.to?iconFor('chevron-right',14):''}`;
    return row.to?`<button type="button" class="fl-row fl-link" data-fl-to="${e(row.to)}">${content}</button>`:`<div class="fl-row fl-plain">${content}</div>`;
  }

  function statsHTML(stats){
    return stats?.length?`<div class="fl-stats">${stats.map(([label,value])=>`<div><span>${e(label)}</span><b>${e(value)}</b></div>`).join('')}</div>`:'';
  }
  function currentDate(page,spec){
    const field=(spec.fields || []).find(f=>f.type==='date');
    if(!field || !['calendar','map'].includes(spec.kind))return {matches:true, value:null};
    const value=page.querySelector('[data-fl-date]')?.value;
    const base=field.value || demoDay;
    if(!value)return {matches:true,value:base};
    let matches=value===base;
    if(spec.kind==='calendar'){
      const selectedTab=(spec.tabs || []).find(tab=>tab.to===page.dataset.flPage)?.label;
      if(selectedTab==='月')matches=value.slice(0,7)===base.slice(0,7);
      if(selectedTab==='周'){
        const monday=isoDate(base);monday.setDate(monday.getDate()-(monday.getDay()+6)%7);
        const end=new Date(monday);end.setDate(end.getDate()+7);
        matches=isoDate(value)>=monday && isoDate(value)<end;
      }
    }
    return {matches,value};
  }
  function results(page) {
    const spec=specs()[page.dataset.flPage]; if(!spec)return;
    const term=page.querySelector('[data-fl-search]')?.value.trim().toLocaleLowerCase() || '';
    const filters=Array.from(page.querySelectorAll('[data-fl-filter]'), el=>el.value).filter(value=>value && !/^(全部|智能排序|默认排序|综合排序)$/.test(value));
    const date=currentDate(page,spec);
    const rows=(spec.rows || []).filter(row=>{
      const data=[row.title,row.sub,row.tag].join(' ').toLocaleLowerCase();
      return date.matches && data.includes(term) && filters.every(value=>data.includes(value.toLocaleLowerCase()));
    });
    const ordering=page.querySelector('[data-fl-sort]')?.value;
    if(ordering)rows.sort((a,b)=>{
      const av=Number(a.sort?.[ordering] ?? Infinity),bv=Number(b.sort?.[ordering] ?? Infinity);
      return av===bv?0:av<bv?-1:1;
    });
    const list=page.querySelector('[data-fl-rows]');
    const stats=page.querySelector('[data-fl-stats]');
    if(stats)stats.innerHTML=date.matches?statsHTML(spec.stats):'';
    if(list){
      const noRecords=term||filters.length?'没有匹配的演示记录':!date.matches?'所选时段暂无演示记录':(spec.empty || '暂无演示记录');
      list.innerHTML=rows.length?rows.map(rowHTML).join(''):`<div class="fl-empty">${iconFor('receipt-text',24)}<p>${e(noRecords)}</p></div>`;
    }
    const map=page.querySelector('.fl-map');
    if(map && !date.matches)map.classList.add('fl-no-points');else if(map)map.classList.remove('fl-no-points');
  }

  function openFlow(key, replace=false){
    const spec=specs()[key];if(!spec)return false;
    if(!permitted(spec.requires)){window.toast('请先完成前一步');return true;}
    if(spec.resetOnEntry && !replace)for(const token of [].concat(spec.resetOnEntry))unlocked.delete(token);
    const tabs=(spec.tabs || []).map(t=>{
      const lock=t.requires || specs()[t.to]?.requires || '';
      return `<button type="button" data-fl-tab="${e(t.to)}" data-fl-requires="${e(lock)}" aria-pressed="${t.to===key}" ${permitted(lock)?'':'disabled'}>${e(t.label)}${lock?'<i class="fl-lock-indicator" aria-hidden="true">'+iconFor('lock-keyhole',12)+'</i>':''}</button>`;
    }).join('');
    const fields=(spec.fields || []).map(fieldHTML).join('');
    const search=spec.search?`<label class="fl-search">${iconFor('search',17)}<input aria-label="${e(spec.search)}" placeholder="${e(spec.search)}" data-fl-search type="search" autocomplete="off"></label>`:'';
    const ordering=spec.sorts?.length?`<label class="fl-sort"><span>排序</span><select aria-label="排序" data-fl-sort>${spec.sorts.map(sort=>`<option value="${e(sort.by || '')}">${e(sort.label)}</option>`).join('')}</select></label>`:'';
    const actions=(spec.actions || []).map((a,i)=>{
      const type=a.to?'button':'submit';
      return `<button type="${type}" class="fl-action" data-fl-action="${i}" ${a.to?'data-fl-to="'+e(a.to)+'"':''}>${e(a.label)}${a.to?iconFor('chevron-right',13):''}</button>`;
    }).join('');
    const hasList=spec.rows!==undefined || spec.empty || spec.search || (['calendar','map'].includes(spec.kind) && spec.fields?.some(f=>f.type==='date'));
    const content=`<section class="fl-page" data-fl-page="${e(key)}"><div class="fl-context"><span></span>演示数据 · 本地预览</div>${spec.note?'<p class="fl-note">'+e(spec.note)+'</p>':''}${tabs?'<div class="fl-tabs" role="group" aria-label="页面分类">'+tabs+'</div>':''}${visual(spec)}${spec.stats?'<div data-fl-stats></div>':''}${search}${filtersHTML(spec.filters)}${ordering}${hasList?'<div class="fl-list" data-fl-rows aria-live="polite"></div>':''}<form class="fl-form" autocomplete="off">${fields}${actions?'<div class="fl-actions">'+actions+'</div>':''}<output class="fl-result" aria-live="polite"></output></form></section>`;
    window.showSheet(spec.title || key,content,{flow:true,key,replace});
    const page=document.querySelector('#sheet-body .fl-page');if(page)results(page);
    return true;
  }

  function changeDate(page,value){
    const ctl=page.querySelector('[data-fl-date]');if(ctl)ctl.value=value;
    const cal=page.querySelector('.fl-calendar');
    if(cal)cal.outerHTML=calendar(value);
    results(page);
  }
  document.addEventListener('click',event=>{
    const button=event.target.closest('button'); if(!button)return;
    const page=button.closest('.fl-page'); if(!page)return;
    const snGroup=button.closest('[data-fl-serials]');
    if(snGroup){
      const list=snGroup.querySelector('.fl-sn-list');
      const inputs=Array.from(list.querySelectorAll('input'));
      inputs.forEach(el=>el.setCustomValidity(''));
      if(button.hasAttribute('data-fl-sn-remove')){
        if(inputs.length>1)button.closest('.fl-sn-row').remove();
        else inputs[0].value='';
        list.querySelector('input').focus();
      }else if(button.hasAttribute('data-fl-sn-add')){
        list.insertAdjacentHTML('beforeend',serialRow(''));list.lastElementChild.querySelector('input').focus();
      }else if(button.hasAttribute('data-fl-sn-scan')){
        const options=normalize(specs()[page.dataset.flPage].fields[Number(snGroup.dataset.flSerials)].options);
        const taken=new Set(inputs.map(input=>input.value.trim()));
        const next=options.find(value=>!taken.has(value));
        if(!next){window.toast('已添加全部示例编号');return;}
        const free=inputs.find(input=>!input.value.trim());
        if(free){free.value=next;free.focus();}
        else{list.insertAdjacentHTML('beforeend',serialRow(next));list.lastElementChild.querySelector('input').focus();}
      }
      page.querySelector('.fl-result').textContent='';
      return;
    }
    if(button.dataset.flTab){if(button.dataset.flTab!==page.dataset.flPage)openFlow(button.dataset.flTab,true);return;}
    if(button.dataset.flTo){if(!openFlow(button.dataset.flTo))window.openDetail(button.dataset.flTo);return;}
    if(button.dataset.flDay){changeDate(page,button.dataset.flDay);page.querySelector('[data-fl-day][aria-pressed="true"]')?.focus({preventScroll:true});return;}
    if(button.dataset.flShift){
      const cal=button.closest('[data-fl-month]');const next=isoDate(cal.dataset.flMonth);next.setMonth(next.getMonth()+Number(button.dataset.flShift));
      const val=page.querySelector('[data-fl-date]')?.value || demoDay;
      cal.outerHTML=calendar(val,next);page.querySelector('[data-fl-shift="'+button.dataset.flShift+'"]')?.focus({preventScroll:true});
    }
  });
  document.addEventListener('input',ev=>{
    const page=ev.target.closest('.fl-page');if(!page)return;
    if(ev.target.matches('[data-fl-search]'))results(page);
    if(ev.target.closest('[data-fl-serials]'))ev.target.closest('[data-fl-serials]').querySelectorAll('input').forEach(input=>input.setCustomValidity(''));
    if(ev.target.matches('.fl-checks input'))ev.target.closest('fieldset').querySelector('input').setCustomValidity('');
    if(ev.target.closest('.fl-form'))page.querySelector('.fl-result').textContent='';
  });
  function verifyMedia(input,field){
    input.setCustomValidity('');
    const file=input.files?.[0];
    if(!file || (!field.minSeconds && !field.maxSeconds))return;
    const url=URL.createObjectURL(file),video=document.createElement('video');
    const token={};mediaChecks.set(input,token);
    let ended=false,timer;
    function finish(error){
      if(ended)return;ended=true;clearTimeout(timer);
      URL.revokeObjectURL(url);
      if(mediaChecks.get(input)===token){
        mediaChecks.delete(input);
        if(input.files?.[0]===file){input.setCustomValidity(error);if(error)input.reportValidity();}
      }
    }
    video.preload='metadata';video.muted=true;
    video.onloadedmetadata=()=>{
      const seconds=video.duration;
      const ok=Number.isFinite(seconds) && (!field.minSeconds || seconds+0.15>=field.minSeconds) && (!field.maxSeconds || seconds<=field.maxSeconds+0.15);
      finish(ok?'':'所选视频时长与本步骤要求不符。');
    };
    video.onerror=()=>finish('无法读取这个视频的时长，请重新选择可预览的视频。');
    input.setCustomValidity('正在检查本机视频时长，请稍候。');
    timer=setTimeout(()=>finish('无法读取视频时长，请更换演示文件。'),5000);
    video.src=url;
  }
  document.addEventListener('sd:sheet-visible',()=>{
    const page=document.querySelector('#sheet-body .fl-page');
    if(page)for(const tab of page.querySelectorAll('[data-fl-requires]'))tab.disabled=!permitted(tab.dataset.flRequires);
  });
  document.addEventListener('change',ev=>{
    const page=ev.target.closest('.fl-page');if(!page)return;
    if(ev.target.matches('[data-fl-filter],[data-fl-sort]'))results(page);
    if(ev.target.hasAttribute('data-fl-media'))verifyMedia(ev.target,specs()[page.dataset.flPage].fields[Number(ev.target.dataset.flMedia)]);
    if(ev.target.matches('[data-fl-date]') && ev.target.value && ['calendar','map'].includes(specs()[page.dataset.flPage].kind))changeDate(page,ev.target.value);
  });
  document.addEventListener('submit',ev=>{
    const form=ev.target.closest('.fl-form');if(!form)return;
    ev.preventDefault();
    const page=form.closest('.fl-page'),spec=specs()[page.dataset.flPage];
    const action=spec.actions?.[Number(ev.submitter?.dataset.flAction ?? 0)];if(!action || action.to)return;
    for(const group of form.querySelectorAll('.fl-checks')){
      const field=spec.fields[Number(group.dataset.flGroup)];
      if(field.required && !group.querySelector('input:checked')){
        const first=group.querySelector('input');
        if(first){first.setCustomValidity('请至少选择一项');first.reportValidity();}return;
      }
    }
    for(const group of form.querySelectorAll('[data-fl-serials]')){
      const field=spec.fields[Number(group.dataset.flSerials)];
      const inputs=Array.from(group.querySelectorAll('input')), seen=new Set();
      for(const input of inputs){
        const value=input.value.trim().toUpperCase();
        if(!value)continue;
        if(seen.has(value)){input.setCustomValidity('设备编号不能重复。');input.reportValidity();return;}
        seen.add(value);
      }
      if(field.required && !seen.size){inputs[0].setCustomValidity('请添加至少一个设备编号。');inputs[0].reportValidity();return;}
    }
    if(!form.reportValidity())return;
    const ranges=[...form.elements].filter(el=>el.type==='datetime-local' || el.type==='date');
    if(ranges.length===2 && ranges[1].value<ranges[0].value){
      form.querySelector('.fl-result').textContent='结束时间须晚于或等于开始时间。';ranges[1].focus();return;
    }
    if(action.label==='查询'){
      results(page);
      const period=ranges.length===2?ranges.map(f=>f.value).join(' 至 '):form.querySelector('[type=month]')?.value || '';
      form.querySelector('.fl-result').textContent=(period?period+' · ':'')+(spec.empty || '查询完成');
      return;
    }
    if(action.unlock)unlocked.add(action.unlock);
    if(action.submitTo){
      window.toast('已保存本次演示步骤');
      openFlow(action.submitTo);
      return;
    }
    const label=action.label.replace(/^模拟/,'');
    form.querySelector('.fl-result').textContent=`已模拟「${label}」。业务账户与设备数据未变更。`;
    window.toast('已完成本地演示');
  });
  window.openFlow=openFlow;
})();
</script>

    '营销推流': () => empty('暂无投放任务', '发布任务后，可查看投放门店、活动时间和执行进度。') + action('查看宣传海报', '宣传海报'),

    '维护奖励': () => empty('暂无维护奖励明细', '工单完成后，可在这里核对奖励来源和结算进度。') + action('查看维护任务', '维护任务'),

  };

  function renderRecordForm(name) {
    const config = recordForms[name];
    const records = localRecords[name];
    const maxLength = name === '异常报备' ? 80 : 32;
    const input = config.field
      ? `<label>${config.field}<input name="value" required maxlength="${maxLength}" autocomplete="off" placeholder="${name === '拜访' ? '例如：示例便利店' : '例如：机柜无法联网'}"></label>`
      : '';
    const savedCheckIn = name === '签到' && records.length > 0;
    const form = savedCheckIn ? '' : `<form class="detail-form" data-detail-form="${name}"><p>${config.hint}</p>${input}<button class="detail-action" type="submit">${config.label}<span aria-hidden="true">→</span></button></form>`;
    return group(config.title, form || row('本次会话','已签到')) + (records.length
      ? group('本次会话记录', ...[...records].reverse().map(entry => row(entry.title,entry.time)))
      : empty('暂无本次记录', '演示记录仅在本次打开页面期间保留。'));
  }

  function openDetail(input) {
    if (Object.prototype.hasOwnProperty.call(window.sdNewFeatures || {}, input)) {
      window.sdNewFeatures[input]();
      return;
    }
    if (window.openFlow?.(input)) return;
    const name = aliases[input] || input;
    if (name !== input && window.openFlow?.(name)) return;
    const body = recordForms[name] ? renderRecordForm(name) : pages[name]?.();
    if (!body) {
      window.toast('暂未收录此业务入口');
      return;
    }
    window.showSheet(name, `<div class="detail-body"><div class="detail-note"><i></i>演示数据</div>${body}</div>`);
  }

  document.addEventListener('click', event => {
    const target = event.target.closest('[data-detail-open]');
    if (target) openDetail(target.dataset.detailOpen);
  });
  document.addEventListener('submit', event => {
    const form = event.target.closest('[data-detail-form]');
    if (!form) return;
    event.preventDefault();
    const name = form.dataset.detailForm;
    const input = form.elements.namedItem('value');
    const value = input?.value.trim();
    if (input && !value) {
      input.value = '';
      input.reportValidity();
      return;
    }
    const now = new Date();
    const time = now.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit',hour12:false});
    if (name === '签到' && localRecords.签到.length) return;
    localRecords[name].push({title: value || '已签到', time, order: now.getTime()});
    openDetail(name);
    window.toast(name === '签到' ? '模拟签到成功' : '已保存本次演示记录');
  });
  window.openDetail = openDetail;
})();
</script>

  // All names, addresses and distances are fixed layout examples.

  ];
  const positions = ['青屿街区','松湾街区'];
  let position=0;
  const installed = new Set();
  const distance = shop => shop.meters[position] < 1000 ? shop.meters[position]+' 米' : (shop.meters[position]/1000).toFixed(2)+' 公里';

  function listHTML() {
    const nearby = shops.filter(shop => !installed.has(shop.id) && shop.meters[position]<=3000)
      .sort((a,b)=>a.meters[position]-b.meters[position]);
    const rows = nearby.map(shop => `<button type="button" class="opp-row" data-opp-shop="${shop.id}">
      <span><b>${shop.name}</b><small>${shop.category} · ${shop.place}</small></span>
      <span class="opp-row-tail">${distance(shop)}<i aria-hidden="true">›</i></span></button>`).join('');
    return `<div class="opp-loc"><div><span class="opp-caption">示例位置</span><h3>${positions[position]}</h3></div>
      <button type="button" class="opp-position" data-opp-position>切换示例位置</button></div>
      <div class="opp-head"><h3>3 公里内的示例门店</h3><span>${nearby.length} 家</span></div>
      <div class="opp-rows">${rows || '<p class="opp-empty">本次打开的示例门店均已标记装机。</p>'}</div>`;
  }

  function detailHTML(shop) {
    const done = installed.has(shop.id);
    return `<div class="opp-loc"><div><span class="opp-caption">示例门店 · ${shop.category}</span><h3>${shop.name}</h3></div></div>
      <dl class="opp-facts"><div><dt>门店位置</dt><dd>${shop.place}</dd></div>
        <div><dt>距示例位置</dt><dd>${distance(shop)}</dd></div>
        <div><dt>装机状态</dt><dd>${done?'已装机（演示）':'待装机'}</dd></div></dl>
      ${done?'<p class="opp-note" role="status">已从本次候选列表中移除，重新打开商机即可恢复。</p>':'<button type="button" class="opp-btn opp-primary" data-opp-install>模拟完成装机</button>'}
      <button type="button" class="opp-btn" data-opp-list>返回附近商机</button>`;
  }
  function refresh() {
    const page=document.querySelector('#sheet-body .opp-page');
    if(!page)return;
    const shop=shops.find(item=>item.id===page.dataset.oppId);
    page.innerHTML=shop?detailHTML(shop):listHTML();
  }
  function open(shop) {
    const id=shop?.id || '';
    window.showSheet(shop?'商户详情':'附近商机',`<section class="opp-page" data-opp-id="${id}"></section>`,{flow:true,key:'nearby-prospect/'+id});
    refresh();
  }
  document.addEventListener('sd:sheet-visible',refresh);
  document.addEventListener('click',event=>{
    const button=event.target.closest('.opp-page button');
    if(!button)return;
    if(button.hasAttribute('data-opp-position')){position=1-position;refresh();return;}
    if(button.hasAttribute('data-opp-list')){open();return;}
    if(button.dataset.oppShop){open(shops.find(s=>s.id===button.dataset.oppShop));return;}
    if(button.hasAttribute('data-opp-install')){
      installed.add(button.closest('.opp-page').dataset.oppId);
      refresh();
    }
  });
  window.sdNewFeatures = window.sdNewFeatures || {};
  window.sdNewFeatures['商机'] = () => {installed.clear();position=0;open();};
})();

      choices:['其他门店的照片','本次到访的现场水印照片','通用活动海报'],correct:1,why:'本次到访的现场水印照片能够说明实际拜访场景。'}
  ];
  const pointsPerCorrect=2, examplePrevious=32;
  const attempts=new Map();
  function getAttempt(id) {
    if(!attempts.has(id))attempts.set(id,{answers:Array(questions.length).fill(null),position:0,done:false});
    return attempts.get(id);
  }
  function score(attempt){return questions.reduce((sum,q,i)=>sum+(attempt.answers[i]===q.correct?1:0),0);}
  function totalPoints(){return examplePrevious+[...attempts.values()].reduce((sum,a)=>sum+(a.done?score(a)*pointsPerCorrect:0),0);}
  const icon=(name,size=18)=>window.icon(name,size);
  function open(kind,id=''){
    const session=sessions.find(s=>s.id===id);
    const title=kind==='home'?'加薪答题':kind==='review'?'错题回看':session.title;
    const content=`<section class="sq-page" data-sq-page="${kind}" data-sq-session="${id}"></section>`;
    window.showSheet(title,content,{flow:true,key:'sq.'+kind+'.'+id});
    const page=document.querySelector('#sheet-body .sq-page');if(page&&!page.children.length)paint(page);
  }
  function card(s){
    const a=attempts.get(s.id);
    const tag=!s.open?'未开放':a?.done?'查看结果':a?'继续体验':'开始体验';
    return `<button type="button" class="sq-session" data-sq-start="${s.id}"><span class="sq-symbol ${s.open?'':'sq-muted'}">${icon(s.icon,22)}</span><span class="sq-session-name"><b>${s.title}</b><small>${s.person} · 已分配 ${s.total} 题</small></span><span class="sq-tag">${tag} ${icon('chevron-right',12)}</span></button>`;
  }
  function home(){
    return `<div class="sq-score"><div><span>示例累计积分</span><strong>${totalPoints()}<small>分</small></strong></div><i>${icon('badge-check',34)}</i></div>
      <section><h3 class="sq-heading">已开放场次</h3><div class="sq-list">${sessions.filter(s=>s.open).map(card).join('')}</div></section>
      <section><h3 class="sq-heading">待开放场次</h3><div class="sq-list">${sessions.filter(s=>!s.open).map(card).join('')}</div></section>
      <p class="sq-note"><b>积分示例</b> 答对 1 道样题加 2 分。积分可作为调薪评估参考，实际调整以团队制度为准。</p>`;
  }
  function paper(s,a){
    const q=questions[a.position], chosen=a.answers[a.position], last=a.position===questions.length-1;
    return `<div class="sq-meta"><span>${s.person}</span><span>分配 ${s.total} 题 · 体验 ${questions.length} 题</span></div>
      <div class="sq-progress">${questions.map((_,i)=>`<i class="${i<=a.position?'on':''}"></i>`).join('')}</div>
      <div class="sq-stamp"><span>样题 ${a.position+1} / ${questions.length}</span><small>${q.category} · 单选</small></div>
      <h3 tabindex="-1" class="sq-question">${q.title}</h3><div class="sq-options" role="group" aria-label="选择答案">
      ${q.choices.map((answer,i)=>`<button type="button" data-sq-choice="${i}" aria-pressed="${chosen===i}"><i>${'ABC'[i]}</i><b>${answer}</b>${chosen===i?icon('check',15):''}</button>`).join('')}</div>
      <div class="sq-nav"><button type="button" data-sq-action="prev" ${a.position===0?'disabled':''}>上一题</button><button class="sq-primary" type="button" data-sq-action="${last?'submit':'next'}" ${chosen===null?'disabled':''}>${last?'提交样题':'下一题'}</button></div>`;
  }
  function result(s,a){
    const correct=score(a);
    return `<div class="sq-meta"><span>样题体验已完成</span><span>${s.person}</span></div>
      <div class="sq-score"><div><span>本次示例积分</span><strong>+${correct*pointsPerCorrect}<small>分</small></strong></div><i>${icon('badge-check',34)}</i></div>
      <div class="sq-stats"><div><span>样题正确率</span><b>${Math.round(correct/questions.length*100)}%</b></div><div><span>答对题数</span><b>${correct} / ${questions.length}</b></div><div><span>累计积分示意</span><b>${totalPoints()} 分</b></div></div>
      <button class="sq-link" type="button" data-sq-action="review">错题回看 <span>${questions.length-correct} 题 ${icon('chevron-right',13)}</span></button>
      <p class="sq-note">积分从示例起点 ${examplePrevious} 分累计，仅统计本次打开期间完成的样题。</p>
      <button class="sq-primary sq-full" type="button" data-sq-action="home">返回场次列表</button>`;
  }
  function review(a){
    const wrong=questions.map((q,i)=>({q,i})).filter(({q,i})=>q.correct!==a.answers[i]);
    if(!wrong.length)return '<div class="sq-empty"><b>全部答对</b><p>本场样题没有错题。</p></div>';
    return `<div class="sq-meta"><span>样题复盘</span><span>${wrong.length} 道错题</span></div>${wrong.map(({q,i},n)=>`<details class="sq-review" ${n===0?'open':''}><summary><small>第 ${i+1} 题 · ${q.category}</small><b>${q.title}</b></summary><p><span>你的选择</span>${q.choices[a.answers[i]]}</p><p><span>参考答案</span><strong>${q.choices[q.correct]}</strong></p><p class="sq-explain">${q.why}</p></details>`).join('')}`;
  }
  function paint(page){
    const {sqPage:kind,sqSession:id}=page.dataset;
    if(kind==='home'){page.innerHTML=home();return;}
    const session=sessions.find(s=>s.id===id);
    if(!session)return;
    if(!session.open){page.innerHTML=`<div class="sq-empty">${icon('lock-keyhole',32)}<b>本场暂未开放</b><p>${session.person} · 计划分配 ${session.total} 题<br>开放时间以场次通知为准。</p></div><button class="sq-full" data-sq-action="home" type="button">返回场次列表</button>`;return;}
    const a=getAttempt(id);
    page.innerHTML=kind==='review'?review(a):a.done?result(session,a):paper(session,a);
  }
  document.addEventListener('sd:sheet-visible',()=>{const p=document.querySelector('#sheet-body .sq-page');if(p)paint(p);});
  document.addEventListener('click',event=>{
    const button=event.target.closest('button'),page=button?.closest('.sq-page');
    if(!page||button.disabled)return;
    const id=page.dataset.sqSession,action=button.dataset.sqAction;
    if(button.dataset.sqStart){open('session',button.dataset.sqStart);return;}
    if(action==='home'){open('home');return;}
    const a=attempts.get(id);if(!a)return;
    if(action==='review' && a.done){open('review',id);return;}
    if(a.done)return;
    if(button.hasAttribute('data-sq-choice')){
      const i=Number(button.dataset.sqChoice);
      if(![0,1,2].includes(i))return;
      a.answers[a.position]=i;paint(page);page.querySelector('[data-sq-choice="'+i+'"]')?.focus({preventScroll:true});return;
    }
    if(action==='prev' && a.position>0)a.position--;
    else if(action==='next' && a.answers[a.position]!==null && a.position<questions.length-1)a.position++;
    else if(action==='submit' && a.answers.every(v=>v!==null))a.done=true;
    else return;
    paint(page);(page.querySelector('.sq-question') || document.getElementById('sheet-title'))?.focus({preventScroll:true});
    document.querySelector('#overlay .sheet')?.scrollTo(0,0);
  });
  window.sdNewFeatures=window.sdNewFeatures || {};
  window.sdNewFeatures['加薪答题']=()=>open('home');
})();

<script>(() => {
  'use strict';
  if (window.renderManage) return;

  const groups = [
    { title: '展业与学习', symbol: '商机', entries: ['商机', '加薪答题', '销售培训'] },
    { title: 'OA管理', symbol: '审批', entries: ['审批', '签到', '轨迹记录', '拜访', '待确认事项', '代理管理'] },
    { title: '商户经营', symbol: '商户管理', entries: ['商户管理', '计费套餐', '优惠用户', '营销推流', '宣传海报', '预付欠款'] },
    { title: '维护管理', symbol: '维护任务', entries: ['维护任务', '维护奖励', '维护地图', '业务预警', '待办事项', '异常报备', '公海'] },
    { title: '设备管理', symbol: '我的设备', entries: ['我的设备', '下级设备', '设备下发', '设备召回', '身份码'] },
    { title: '财务管理', symbol: '活动奖励', entries: ['活动奖励'] },
  ];
  const fullPage = new URLSearchParams(location.search).get('view') === 'overview-child';
  const openGroups = new Set(fullPage ? groups.map((_, index) => index) : [1]);
  const featureHints = {'商机':'3 公里内', '加薪答题':'本期试卷', '销售培训':'课件与视频'};
  const keywords = {'商机':'附近 商户 门店 位置 定位 装机 商户车', '加薪答题':'考试 选择题 试卷 积分 知识库', '销售培训':'学习 文案 话术 PPT 课件 视频'};
  const searchCollapsed = new Set();
  const total = groups.reduce((number, group) => number + group.entries.length, 0);
  let query = '';

  function safeText(value) {
    return value.replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[ch]);
  }

  function searchResults() {
    const term = query.trim().toLowerCase();
    return groups.map(({ title, symbol, entries }, index) => ({
      title, symbol, index,
      entries: entries.filter(name => (title + ' ' + name + ' ' + (keywords[name] || '')).toLowerCase().includes(term)),
    })).filter(group => group.entries.length);
  }

  function expanded(index) {
    return query.trim() ? !searchCollapsed.has(index) : openGroups.has(index);
  }

  function panels(matches) {
    if (!matches.length) {
      return `<div class="ma-empty"><h2>没有找到匹配的业务</h2>
        <button type="button" data-ma-reset>清除搜索</button></div>`;
    }
    return matches.map(({ title, index, symbol, entries }) => {
      if (index === 0) {
        return '<section class="ma-featured"><h2>' + title + '</h2><div class="ma-shortcuts">' +
          entries.map(name => '<button type="button" class="ma-shortcut" data-ma-entry="' + name + '">' +
            '<span class="ma-shortcut-icon">' + icon('mg-' + name, 23) + '</span><b>' + name +
            '</b><small>' + featureHints[name] + '</small></button>').join('') + '</div></section>';
      }
      const isOpen = expanded(index);
      const items = entries.map(name =>
        `<button class="ma-entry" type="button" data-ma-entry="${name}">
          <span class="ma-entry-symbol" aria-hidden="true">${icon('mg-' + name, 20)}</span>
          <span>${name}</span></button>`
      ).join('');
      return `<section class="ma-panel" aria-labelledby="ma-heading-${index}">
        <h2 id="ma-heading-${index}"><button class="ma-heading" type="button" data-ma-category="${index}"
          aria-expanded="${isOpen}" aria-controls="ma-list-${index}">
          <span class="ma-cover-icon" aria-hidden="true">${icon('mg-' + symbol, 23)}</span>
          <span class="ma-cover-title">${title}</span><span class="ma-count">${entries.length} 项</span>
          <span class="ma-expander" aria-hidden="true"></span>
        </button></h2>
        <div class="ma-list" id="ma-list-${index}" ${isOpen ? '' : 'hidden'}>${items}</div>
      </section>`;
    }).join('');
  }

  function info(matches) {
    const n = matches.reduce((sum, group) => sum + group.entries.length, 0);
    return query.trim() ? `找到 ${n} 项业务` : `${groups.length} 个分类 · ${total} 项业务`;
  }

  window.renderManage = function renderManage() {
    const matches = searchResults();
    return `<section class="ma-page" aria-labelledby="ma-title">
      <header class="ma-title"><h1 id="ma-title">业务中心</h1></header>
      <div class="ma-search">${icon('search', 20)}
        <input type="text" inputmode="search" enterkeyhint="search" autocomplete="off" aria-label="搜索业务功能"
          data-ma-input value="${safeText(query)}" placeholder="搜索业务功能">
        <button type="button" class="ma-clear" data-ma-clear aria-label="清除搜索" ${query ? '' : 'hidden'}>${icon('x', 15)}</button>
      </div>
      <div class="ma-index-head"><h2>业务分类</h2><span aria-live="polite" data-ma-status>${info(matches)}</span></div>
      <div class="ma-panels">${panels(matches)}</div>
    </section>`;
  };

  function update(page) {
    const matches = searchResults();
    page.querySelector('[data-ma-clear]').hidden = !query;
    page.querySelector('[data-ma-status]').textContent = info(matches);
    page.querySelector('.ma-panels').innerHTML = panels(matches);
  }

  document.addEventListener('input', event => {
    if (!event.target.matches('.ma-page [data-ma-input]')) return;
    query = event.target.value;
    searchCollapsed.clear();
    update(event.target.closest('.ma-page'));
  });
  document.addEventListener('click', event => {
    const button = event.target.closest('.ma-page button');
    if (!button) return;
    if (button.hasAttribute('data-ma-entry')) {
      openDetail(button.dataset.maEntry);
      return;
    }
    const page = button.closest('.ma-page');
    if (button.hasAttribute('data-ma-category')) {
      const index = Number(button.dataset.maCategory);
      const wasOpen = expanded(index);
      const states = query.trim() ? searchCollapsed : openGroups;
      if (states.has(index)) states.delete(index);
      else states.add(index);
      button.setAttribute('aria-expanded', String(!wasOpen));
      page.querySelector('#ma-list-' + index).hidden = wasOpen;
    } else if (button.hasAttribute('data-ma-clear') || button.hasAttribute('data-ma-reset')) {
      const input = page.querySelector('[data-ma-input]');
      query = input.value = '';
      searchCollapsed.clear();
      update(page);
      input.focus();
    }
  });
})();
</script>

      show(title, `<div class="detail-empty"><strong>暂无该时段设备统计</strong><p>${cabinetPeriod.date}</p></div>`);

    }
    if (offlineOnly) {
      window.openFlow('机柜离线');

    show(title, `<div class="detail-stat"><span>机柜24小时在线率</span><strong>${rate}<small>%</small></strong></div>

  function renderLoss() {

    return `<section><button type="button" class="a-claim" data-a-panel="loss"><span class="a-claim-top"><b>丢失赔偿</b>${icon('chevron-right',15)}</span>

    show('商户信息详情', `<section class="detail-block">${detailRow('商户名称',item.merchant)}${detailRow('入网审核状态',item.status)}

  window.homeScreen = function(data) {
    cabinetPeriod = data;
    return `<div class="a-home"><div class="a-title"><h1>赏电·代理版</h1><div class="a-quick">
      <button type="button" data-a-panel="notice">公告</button><button type="button" data-a-panel="message">消息</button></div></div>
      ${renderCabinets(data)}${renderTasks()}${renderSales()}${renderLoss()}</div>`;
  };

  document.addEventListener('click', e => {
    const button = e.target.closest('button[data-a-period],button[data-a-metric],button[data-a-panel],button[data-a-review]');
    if (!button) return;
    if (button.dataset.aPeriod) {
      salesPeriod = button.dataset.aPeriod;
      const block = button.closest('.a-trade');
      block.querySelectorAll('[data-a-period]').forEach(item => item.setAttribute('aria-pressed',String(item.dataset.aPeriod === salesPeriod)));
      block.querySelector('.a-trade-grid').innerHTML = renderTiles();
      return;
    }
    if (button.hasAttribute('data-a-metric')) { showMetric(Number(button.dataset.aMetric)); return; }
    if (button.hasAttribute('data-a-review')) { showMerchant(Number(button.dataset.aReview)); return; }
    switch (button.dataset.aPanel) {
      case 'notice': showNotice(); break;
      case 'message': showMessages(); break;
      case 'cabinet': showCabinets(false); break;
      case 'offline': showCabinets(true); break;
      case 'loss': show('丢失赔偿', detailRow('总丢失赔偿', '¥' + number(loss.total, '元')) + detailRow('累计已赔偿', '¥' + number(loss.paid, '元')) + detailRow('待赔偿', '¥' + number(loss.total - loss.paid, '元'))); break;
    }
  });
})();
